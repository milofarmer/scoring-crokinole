# Crokinole tournament — one container, the database in a named volume.
#   docker compose up --build   ->   http://localhost:8085
#
# For an actual event, use the Mac app instead: it runs this same server without
# anyone having to install Docker first.
services:
  crok:
    build: .
    ports:
      - "8085:8085"        # 8080 is used by smt-tennis-playout
    environment:
      CROK_DB_PATH: /data/crok.sqlite
      PORT: 8085
      # The address players see on the board, instead of an IP nobody can
      # remember and that changes with every router. Announce it with
      #   tools/announce-name.sh
      # and leave that running for the tournament. The board keeps showing the
      # numeric address underneath, because Android below version 12 cannot
      # resolve .local names.
      CROK_HOSTNAME: "croki.local:8085"
    volumes:
      # Bind-mounted so an edit shows on reload without a rebuild.
      - ./src:/app/src
      - ./public:/app/public
      - crok_data:/data
    restart: unless-stopped

volumes:
  crok_data:
